name: Check paper worksheets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select the installed Chromium
        run: echo "CHROMIUM_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils libreoffice-writer libreoffice-calc
      - run: python -m pip install -r requirements-test.txt
      # Check the committed assets before regenerating, so stale PDFs fail CI.
      - run: npm run materials:check
      - run: python tests/paper_pdf.py
      - run: node tests/materials_rebuild.cjs
      - run: npm test
      - run: npm run materials:build -- --force
      - uses: actions/upload-artifact@v4
        with:
          name: vl3-paper-materials
          path: materials/
          retention-days: 14
